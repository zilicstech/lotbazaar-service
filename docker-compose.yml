services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lotbazaar
      POSTGRES_USER: lotbazaar
      POSTGRES_PASSWORD: lotbazaar
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # STOMP plugin backs the WebSocket broker relay for live auctions (review decision 6).
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_web_stomp && rabbitmq-server"
    ports: ["5672:5672", "61613:61613", "15672:15672"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]

volumes:
  pgdata:
