spring.application.name=lotbazaar
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/lotbazaar}
spring.datasource.username=${DB_USER:lotbazaar}
spring.datasource.password=${DB_PASSWORD:lotbazaar}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
lotbazaar.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
# Every pooled connection runs as the RLS-bound role, so even a query outside a transaction cannot bypass RLS.
spring.datasource.hikari.connection-init-sql=SET ROLE lotbazaar_app
# Flyway gets its own owner connection (the app role cannot run DDL).
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5433/lotbazaar}
spring.flyway.user=${DB_USER:lotbazaar}
spring.flyway.password=${DB_PASSWORD:lotbazaar}
